name: .NET Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Restore dependencies
      run: dotnet restore CooperativeProcurement.sln
    
    - name: Build
      run: dotnet build CooperativeProcurement.sln --no-restore --configuration Release /p:TreatWarningsAsErrors=false /p:CodeAnalysisTreatWarningsAsErrors=false
    
    - name: Test
      run: dotnet test CooperativeProcurement.sln --no-build --configuration Release --verbosity normal
    
    - name: Check formatting
      run: dotnet format CooperativeProcurement.sln --verify-no-changes --verbosity diagnostic